<svg xmlns="http://www.w3.org/2000/svg" width="80" height="64" viewBox="-40 -44 80 64">
  <!-- The marker over a unit or place being pointed out: a glowing chevron, pointing down at it (render.js draws the same) -->
  <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path d="M-22 -26 L0 0 L22 -26 L13 -26 L0 -12 L-13 -26 Z" fill="rgba(255, 170, 40, 0.2)" stroke="#ffae2a" stroke-width="3.4" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M-22 -26 L0 0 L22 -26 L13 -26 L0 -12 L-13 -26 Z" fill="none" stroke="#fff0a0" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
