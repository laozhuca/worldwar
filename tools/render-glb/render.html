<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const F = new THREE.Vector3(-0.61237, -0.61237, -0.5); // the game's view direction (map X, Y on the ground, Z up)
const L = new THREE.Vector3(-0.38, -0.62, 0.69).normalize(); // the game's sun (-0.62, -0.38, 0.69) with X and Y swapped: the game's map is the mirror image of three.js's right-handed world
let model;
window.load = async (f) => { model = (await new GLTFLoader().loadAsync(f)).scene; return true; };
// render: yaw (rad), S = tiles per model unit, P = px per tile; returns { url, ax, ay } (ax, ay: where the model's centre on the ground lands)
window.renderTown = ({ yaw, S, P, marker, ground = 0, tread = null }) => {
  const scene = new THREE.Scene();
  const root = new THREE.Group(); scene.add(root);
  const m = model.clone(true);
  m.rotation.x = Math.PI / 2; // glTF Y up -> Z up
  const holder = new THREE.Group(); holder.add(m); holder.rotation.z = yaw; holder.scale.setScalar(S);
  root.add(holder);
  holder.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(holder);
  const c = bb.getCenter(new THREE.Vector3());
  holder.position.set(-c.x, -c.y, -bb.min.z);
  holder.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(holder);
  m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; const mt = o.material = o.material.clone(); mt.metalness = 0; mt.roughness = 0.9; mt.metalnessMap = null; mt.roughnessMap = null;
    // tread: { band: [a, b], hw, ax, ay, period, phase } - the track belts (surfaces facing out of the side
    // profile, within the band of the half-width) painted with tread links shifted by phase: a frame of the
    // tracks running (for a model whose tracks are not separate parts)
    if (tread) {
      const T = tread, key = JSON.stringify(T);
      mt.customProgramCacheKey = () => key;
      mt.onBeforeCompile = (sh) => {
        sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vMP; varying vec3 vMN;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvMP = position; vMN = normal;');
        sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vMP; varying vec3 vMN;').replace('#include <map_fragment>', `#include <map_fragment>
          { float lat = abs(vMP.z) / ${T.hw.toFixed(4)}; vec3 n = normalize(vMN);
            if (lat > ${T.band[0].toFixed(3)} && lat < ${T.band[1].toFixed(3)} && abs(n.z) < 0.45) {
              float th = atan(vMP.y / ${T.ay.toFixed(4)}, vMP.x / ${T.ax.toFixed(4)});
              float k = fract(th * ${(T.r / T.period).toFixed(4)} + ${T.phase.toFixed(4)});
              float plate = smoothstep(0.0, 0.1, k) * (1.0 - smoothstep(0.58, 0.68, k));
              diffuseColor.rgb *= mix(0.18, 1.35, plate);
            } }`);
      };
    }
    mt.needsUpdate = true; } });
  if (marker) { const q = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: 0xff0000 })); q.position.set(3, 0, 0.15); scene.add(q); }
  // ground: receives the shadow only
  const R = Math.max(b2.max.x - b2.min.x, b2.max.y - b2.min.y);
  const gp = new THREE.Mesh(new THREE.PlaneGeometry(R * 3, R * 3), new THREE.ShadowMaterial({ opacity: 0.55 }));
  gp.receiveShadow = true; scene.add(gp);
  // light
  const sun = new THREE.DirectionalLight(0xfff7ed, 3.4);
  sun.position.copy(L.clone().multiplyScalar(R * 3)); sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const sc = sun.shadow.camera; sc.left = -R * 1.5; sc.right = R * 1.5; sc.top = R * 1.5; sc.bottom = -R * 1.5; sc.near = 0.1; sc.far = R * 8;
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
  scene.add(sun); scene.add(sun.target);
  scene.add(new THREE.HemisphereLight(0x94a3bd, 0x3a3a3c, 1.6));
  // camera: orthographic, along the game's view direction, sized to the model's screen footprint
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -R * 10, R * 10);
  cam.up.set(0, 0, 1); cam.position.copy(F.clone().multiplyScalar(-R * 3)); cam.lookAt(0, 0, 0); cam.updateMatrixWorld(true);
  // the screen extent of the bounding box corners (+ the shadow)
  const pts = [];
  for (const x of [b2.min.x - R * 0.3, b2.max.x + R * 0.1]) for (const y of [b2.min.y - R * 0.3, b2.max.y + R * 0.1]) for (const z of [0, b2.max.z]) pts.push(new THREE.Vector3(x, y, z));
  const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of pts) { const a = p.dot(right), b = p.dot(up); x0 = Math.min(x0, a); x1 = Math.max(x1, a); y0 = Math.min(y0, b); y1 = Math.max(y1, b); }
  cam.left = x0; cam.right = x1; cam.top = y1; cam.bottom = y0; cam.updateProjectionMatrix();
  const PXU = 45.2548 * P; // px per world unit (tile) along the screen axes
  const W = Math.ceil((x1 - x0) * PXU), H = Math.ceil((y1 - y0) * PXU);
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.outputColorSpace = THREE.SRGBColorSpace; r.setClearColor(0x000000, ground ? 1 : 0);
  r.render(scene, cam);
  const url = r.domElement.toDataURL('image/png');
  r.dispose();
  return { url, W, H, ax: Math.round(-x0 * PXU), ay: Math.round(y1 * PXU), size: [b2.max.x - b2.min.x, b2.max.y - b2.min.y, b2.max.z], right: right.toArray(), up: up.toArray() };
};
